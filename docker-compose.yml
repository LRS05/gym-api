version: '3.8'

services:
  api:
    container_name: gym-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    env_file:
      - .env

  mysql:
    container_name: gym-mysql
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: gym_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
