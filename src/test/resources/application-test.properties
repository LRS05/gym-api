# Conexión a base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecto H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate: genera el schema a partir de tus entidades JPA
spring.jpa.hibernate.ddl-auto=create-drop

# Ver SQL en consola (opcional)
spring.jpa.show-sql=true

# Permitir ejecutar data.sql después de crear el schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Habilitar consola H2 (opcional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.root=INFO

